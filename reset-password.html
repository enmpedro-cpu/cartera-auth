<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cartera Financiera — Restablecer Contraseña</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .header { text-align: center; margin-bottom: 24px; }
    .logo { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #f8fafc; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #38bdf8; }
    .btn { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 8px; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .alert { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; display: none; line-height: 1.4; }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
    .alert-success { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #86efac; }
    .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">📈</div>
      <h1>Restablecer Contraseña</h1>
      <p>Establece una nueva contraseña para tu cuenta de Mi Cartera Financiera.</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">Nueva Contraseña</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="Repite la contraseña">
      </div>
      <button type="submit" id="submitBtn" class="btn">Guardar Contraseña</button>
    </form>

    <div class="footer">
      🔒 Autenticación cifrada · Supabase Auth · Aislamiento multiusuario
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ujzgvxiniaohvnwlqtre.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqemd2eGluaWFvaHZud2xxdHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTQyODUsImV4cCI6MjA5MTQzMDI4NX0.zLdHGtvmAaJP5dtpuB25cmn8OyI0kjojexj8fMTFXqc';

    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(msg, type) {
      alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertBox.innerHTML = msg;
      alertBox.style.display = 'block';
    }

    // Extraer tokens desde el hash de redirección de Supabase Auth
    const hash = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hash);
    const accessToken = hashParams.get('access_token');
    const type = hashParams.get('type');
    const errorDesc = hashParams.get('error_description') || hashParams.get('error');

    if (errorDesc) {
      showAlert('Error en el enlace: ' + decodeURIComponent(errorDesc), 'error');
      form.style.display = 'none';
    } else if (!accessToken) {
      showAlert('Enlace no válido o expirado. Si necesitas restablecer tu contraseña, solicita un nuevo enlace.', 'error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!accessToken) return;

      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1.length < 6) {
        showAlert('La contraseña debe tener al menos 6 caracteres.', 'error');
        return;
      }
      if (p1 !== p2) {
        showAlert('Las contraseñas no coinciden. Por favor, revísalas.', 'error');
        return;
      }

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Guardando contraseña...';

      try {
        const resp = await fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + accessToken
          },
          body: JSON.stringify({ password: p1 })
        });

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.msg || data.error_description || 'Error al actualizar la contraseña');
        }

        showAlert('🎉 <strong>¡Contraseña actualizada con éxito!</strong><br><br>Ya puedes regresar a tu Custom GPT en ChatGPT, hacer clic en <strong>Sign in</strong> e iniciar sesión con tu cuenta.', 'success');
        form.style.display = 'none';
      } catch (err) {
        showAlert(err.message || 'Error al comunicarse con el servidor', 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Guardar Contraseña';
      }
    });
  </script>
</body>
</html>
